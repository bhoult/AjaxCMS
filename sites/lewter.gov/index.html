<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<meta charset="UTF-8">
		<title>Lewter.gov</title>

		<!-- Configuration -->
		<script>
			var default_background = "fireworks";
			var ajaxcms_google_analytics = '';
			var ajaxcms_splash_time = 0;
		</script>

		<!-- jQuery (from npm) -->
		<script src="node_modules/jquery/dist/jquery.min.js"></script>
		<script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
		<link href="node_modules/jquery-ui-dist/jquery-ui.min.css" rel="stylesheet">

		<!-- Bootstrap (from npm) -->
		<link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

		<!-- Markdown parser (from npm) -->
		<script src="node_modules/marked/lib/marked.umd.js"></script>

		<!-- Background Animation Libraries (from npm) -->
		<script src="js/victor.js"></script>
		<script src="node_modules/segment-js/dist/segment.min.js"></script>

		<!-- Custom Background Animation & Swipe Support -->
		<script src="js/canvasstuff.js"></script>
		<script src="js/jquery-mobile-swipe.js"></script>

		<!-- CMS Javascript -->
		<script src="js/ajaxcms.js"></script>

		<!-- fonts.google.com -->
		<link href="https://fonts.googleapis.com/css?family=Montserrat:700&display=swap" rel="stylesheet">

		<!-- Load theme -->
		<script>
			theme = default_background;
			// Load theme CSS
			$('<link>').appendTo('head').attr({type : 'text/css', rel : 'stylesheet'}).attr('href', 'themes/'+default_background+'/theme.css');
			// Load theme background.js and signal when ready
			$.getScript('themes/'+default_background+'/background.js')
				.done(function() {
					setTimeout(function() {
						if (window.themeReady) {
							window.themeReady();
						}
					}, 100);
				})
				.fail(function(jqxhr, settings, exception) {
					console.error('Error loading theme:', exception);
					if (window.themeReady) {
						window.themeReady();
					}
				});
		</script>

		<style>
			body {
				overflow-x: hidden;
				padding-bottom: 100px;
			}

			#background {
			  position:fixed;
			  z-index:-1;
			  width:100%;
			  height:100%;
			  background: linear-gradient(#001, #112);
			}
			#foreground {
			  position:fixed;
			  z-index:0;
			  width:100%;
			  height:100%;
			  pointer-events:none;
			}
			#background-div {
			  position:fixed;
			  z-index:0;
			  width:100%;
			  height:100%;
			  overflow:hidden;
			}

			nav.navbar {
				margin-bottom:0px;
				z-index:1;
				border-radius:0px 0px 10px 10px;
				background-color: rgba(20, 40, 80, 0.95) !important;
			}

			nav.navbar .navbar-brand,
			nav.navbar .nav-link {
				color: #fff !important;
			}

			nav.navbar .nav-link:hover {
				color: #ffd700 !important;
			}

			.container {
				padding-bottom:100px;
				border-radius:4px 4px 0px 0px;
				color:black;
			}

			#a, #b {
				position:absolute;
				top: 0px;
				left: 0;
				right: 0;
				z-index:0;
				background-color:rgba(255,255,255,0.5);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				border-radius:0px 0px 8px 8px;
				color:black;
				margin-bottom:50px;
				padding-bottom:100px;
			}

			#main {
				width: 100%;
				position: relative;
			}

			#main>div {
				padding: 0px 10px 20px 10px;
			}

			#main img {
				margin:10px;
			}
			#main .carousel img {
				margin:0px;
			}
			img.thumb {
				width:20px;
			}
			img.icon {
				width:70px;
			}
			img.small {
				width:300px;
			}
			img.medium {
				width:600px;
			}
			img.large {
				width:900px;
			}
			img.left {
				float:left;
			}
			img.right {
				float:right;
			}

			.carousel {
				padding:0px;
			}

			.image-gallery img {
				width: 100%;
				height: auto;
				border-radius: 4px;
				cursor: pointer;
				transition: transform 0.2s;
			}

			.image-gallery img:hover {
				transform: scale(1.05);
			}

			.image-lightbox {
				display: none;
				position: fixed;
				z-index: 9999;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0);
				cursor: pointer;
				transition: background-color 0.3s ease;
			}

			.image-lightbox.active {
				background-color: rgba(0, 0, 0, 0.9);
			}

			.image-lightbox img {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%) scale(0.8);
				width: 100%;
				height: auto;
				max-height: 100vh;
				object-fit: contain;
				opacity: 0;
				transition: all 0.3s ease;
			}

			.image-lightbox.active img {
				transform: translate(-50%, -50%) scale(1);
				opacity: 1;
			}

			ul.filelist li {
				list-style-type:none;
			}
			ul.filelist li a.folder:hover {
				text-decoration:none;
			}

			footer {
				position:fixed;
				left:0px;
				bottom:0px;
				width:100%;
				background: rgba(20, 40, 80, 0.95);
				color:white;
				text-align:center;
				padding:5px;
				font-size:2vw;
			}
			footer a {color:#ffd700;}
			footer a:hover {color:#ffec8b;}

			h1, h2, h3 {
				color: #1a3a6e;
			}

			/* Responsive images */
			#main img {
				max-width: 100%;
				height: auto;
			}

			/* Mobile styles */
			@media (max-width: 576px) {
				nav.navbar .navbar-brand {
					font-size: 1.1em !important;
				}
				/* Stack floated images on mobile */
				#main div[style*="float: left"],
				#main div[style*="float: right"] {
					float: none !important;
					margin: 10px auto !important;
					display: block;
					text-align: center;
				}
				#main img {
					max-width: 80% !important;
				}
				h2 {
					font-size: 1.4em;
					text-align: center;
				}
				footer {
					font-size: 12px;
				}
			}

			@media (min-width: 577px) and (max-width: 768px) {
				nav.navbar .navbar-brand {
					font-size: 1.3em !important;
				}
				footer {
					font-size: 14px;
				}
			}

			@media (min-width: 769px) {
				footer {
					font-size: 14px;
				}
			}

			/* Form styling */
			.ajaxcms-form {
				max-width: 500px;
				margin: 0 auto;
			}
			.ajaxcms-form .form-group {
				margin-bottom: 15px;
			}
			.ajaxcms-form label {
				display: block;
				margin-bottom: 5px;
				font-weight: 600;
				color: #1a3a6e;
			}
			.form-message {
				margin-top: 10px;
				padding: 10px;
				border-radius: 4px;
			}
			.form-success {
				background-color: #d4edda;
				color: #155724;
			}
			.form-error {
				background-color: #f8d7da;
				color: #721c24;
			}
		</style>
	</head>

	<body>
		<canvas id="background"></canvas>
		<canvas id="foreground"></canvas>
		<div id="background-div"></div>
		<div class="container" style="display:none;">
			<header>
			</header>

		<nav class="navbar navbar-expand-lg navbar-dark">
			<div class="container">
			    <a class="navbar-brand" href="javascript:void(0);" style="font-family: 'Montserrat', sans-serif; font-size: 1.5em;">Jennifer Lewter for Arkansas</a>
			    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
			      <span class="navbar-toggler-icon"></span>
			    </button>
			  <div class="collapse navbar-collapse" id="navbar">
			    <ul id='menu' class="navbar-nav me-auto mb-2 mb-lg-0">
			    </ul>
			  </div>
			</div>
		</nav>

		<div class="container">
			<main id="main" style="position:relative;">
				<div id='a' style=""></div>
				<div id='b' style="display:none;"></div>
			</main>
		</div>

			<footer>
				<div>
					Lewter.gov - Official Government Website
				</div>
			</footer>
		</div>
	</body>

</html>
