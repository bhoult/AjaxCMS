<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<meta charset="UTF-8">
		<title>AjaxCMS</title>
		
		<!-- Configuration -->
		<script>
			var default_background = "network";
			var ajaxcms_google_analytics = 'UA-84079705-1';
			var ajaxcms_splash_time = 3000;
		</script>
		
		<!-- Jquery -->
		<script src="node_modules/jquery/dist/jquery.min.js"></script>
		<script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
		<link href="node_modules/jquery-ui-dist/jquery-ui.min.css" rel="stylesheet">  
		
		<!-- Bootstrap -->
		<link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

		<!-- Auto-load all CSS files from css/ directory -->
		<script>
			$.get('./api/list?dir=css')
				.done(function(data) {
					if (data.files && data.files.length > 0) {
						data.files.forEach(function(file) {
							if (file.name.endsWith('.css')) {
								$('<link>').appendTo('head').attr({
									type: 'text/css',
									rel: 'stylesheet',
									href: 'css/' + file.name
								});
							}
						});
					}
				})
				.fail(function() {
					// css/ directory doesn't exist yet, silently continue
				});
		</script>

		<!-- Markdown parser -->
		<script src="node_modules/marked/lib/marked.umd.js"></script>
		
		<!-- Polyfills -->
		
		<!-- Background Animation -->
		<script src="js/victor.js"></script>
		<script src="js/canvasstuff.js"></script>
		<script src="js/jquery-mobile-swipe.js"></script>
		<script src="node_modules/segment-js/dist/segment.min.js"></script>
		
		<!-- CMS Javascript -->
		<script src="js/ajaxcms.js"></script>
		
		<!-- fonts.google.com - Network theme fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

		<!-- Load theme -->
		<script>
			theme = default_background;
			// Load theme CSS
			$('<link>').appendTo('head').attr({type : 'text/css', rel : 'stylesheet'}).attr('href', 'themes/'+default_background+'/theme.css?v=' + Date.now());
			// Load theme background.js and signal when ready
			$.getScript('themes/'+default_background+'/background.js')
				.done(function() {
					// Theme script loaded, signal ready after a brief delay for initialization
					setTimeout(function() {
						if (window.themeReady) {
							window.themeReady();
						}
					}, 100);
				})
				.fail(function(jqxhr, settings, exception) {
					console.error('Error loading theme:', exception);
					// Still signal ready so the site doesn't hang
					if (window.themeReady) {
						window.themeReady();
					}
				});
		</script>
		
	</head>
	
	<body>
		<canvas id="background"></canvas>
		<div id="background-div"></div>
		<div class="container" style="display:none;">
			<header>
			</header>
			
			<!-- Static navbar -->
		<nav class="navbar navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
			    <a class="navbar-brand" href="javascript:void(0);" style="width:200px;"><img src='images/ajaxcms.svg' style="position:relative; top: -20px; z-index:2; width:180px;"></a>
			    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
			      <span class="navbar-toggler-icon"></span>
			    </button>
			  <div class="collapse navbar-collapse" id="navbar">
			    <ul id='menu' class="navbar-nav me-auto mb-2 mb-lg-0">
			    	<!-- Pages get inserted here to make menu -->
			    </ul>
			  </div><!--/.navbar-collapse -->
			</div><!--/.container-fluid -->
		</nav>
			
			<main id="main" style="position:relative; width:100%;">
				<!-- Content gets inserted here, a and b are for making page style transitions. -->
				<div id='a' style=""></div>
				<div id='b' style="display:none;"></div>
			</main>
			
			<footer>
				<div>
					Content &#9400; Brandon Hoult 2016-2025. AjaxCMS is open source under the <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank">GPL-3.0 License</a>. Email: <a href="mailto:bhoult@gmail.com">bhoult@gmail.com</a>
				</div>
			</footer>
		</div>
		
		<!-- Google Analytics -->
		<script>
		  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
		
		  ga('create', ajaxcms_google_analytics, 'auto');
		  //ga('send', 'pageview');
		</script>
	</body>

</html>
