		<!-- Header Video Randomizer -->
		<script>
		(function() {
			var headerVideos = [];
			var shuffledVideos = [];
			var currentIndex = 0;
			var videoA = null;
			var videoB = null;
			var activeVideo = 'A';
			var errorCount = 0;
			var maxErrors = 5;
			var preloadedVideos = {};
			var preloadStarted = false;

			// Shuffle array using Fisher-Yates algorithm
			function shuffleArray(array) {
				var shuffled = array.slice();
				for (var i = shuffled.length - 1; i > 0; i--) {
					var j = Math.floor(Math.random() * (i + 1));
					var temp = shuffled[i];
					shuffled[i] = shuffled[j];
					shuffled[j] = temp;
				}
				return shuffled;
			}

			// Preload all videos in background after first video starts
			function preloadAllVideos() {
				if (preloadStarted) return;
				preloadStarted = true;

				headerVideos.forEach(function(filename, index) {
					// Stagger preloads to avoid overwhelming the connection
					setTimeout(function() {
						if (preloadedVideos[filename]) return;
						var video = document.createElement('video');
						video.preload = 'auto';
						video.muted = true;
						video.style.display = 'none';
						video.src = 'images/' + filename;
						video.load();
						preloadedVideos[filename] = video;
					}, index * 500); // 500ms between each preload start
				});
			}

			function getNextFilename() {
				if (currentIndex >= shuffledVideos.length) {
					shuffledVideos = shuffleArray(headerVideos);
					currentIndex = 0;
				}
				return shuffledVideos[currentIndex++];
			}

			// Play next video with crossfade
			function playNextVideo() {
				if (headerVideos.length === 0) return;
				if (errorCount >= maxErrors) {
					console.log('Too many video errors, stopping');
					return;
				}

				var currentVideo = (activeVideo === 'A') ? videoA : videoB;
				var nextVideo = (activeVideo === 'A') ? videoB : videoA;

				var filename = getNextFilename();
				var videoUrl = 'images/' + filename;

				// Ensure next video is completely hidden and reset
				nextVideo.style.visibility = 'hidden';
				nextVideo.style.opacity = '0';

				var swapped = false;
				function doSwap() {
					if (swapped) return;
					swapped = true;
					errorCount = 0;

					// Show next video
					nextVideo.style.opacity = '1';
					nextVideo.style.visibility = 'visible';

					// Hide current video
					currentVideo.style.visibility = 'hidden';
					currentVideo.style.opacity = '0';
					currentVideo.pause();

					activeVideo = (activeVideo === 'A') ? 'B' : 'A';

					// Start preloading all videos after first video plays
					preloadAllVideos();
				}

				function onReady() {
					nextVideo.removeEventListener('canplaythrough', onReady);
					// Seek past first frame, then swap
					nextVideo.currentTime = 0.1;
					nextVideo.onseeked = function() {
						nextVideo.onseeked = null;
						doSwap();
						nextVideo.play();
					};
				}

				function onError() {
					nextVideo.removeEventListener('error', onError);
					console.log('Video load error');
					errorCount++;
					setTimeout(playNextVideo, 100);
				}

				nextVideo.addEventListener('canplaythrough', onReady);
				nextVideo.addEventListener('error', onError);
				nextVideo.src = videoUrl;
				nextVideo.load();
			}

			// Initialize when DOM is ready
			$(document).ready(function() {
				var container = document.querySelector('.header-video-container');
				if (!container) return;

				// Create two video elements for seamless preload
				videoA = document.getElementById('header-video');
				videoA.style.position = 'absolute';
				videoA.style.top = '0';
				videoA.style.left = '0';
				videoA.style.width = '100%';
				videoA.style.visibility = 'visible';
				videoA.style.opacity = '1';

				videoB = document.createElement('video');
				videoB.muted = true;
				videoB.playsInline = true;
				videoB.preload = 'auto';
				videoB.style.position = 'absolute';
				videoB.style.top = '0';
				videoB.style.left = '0';
				videoB.style.width = '100%';
				videoB.style.visibility = 'hidden';
				videoB.style.opacity = '0';
				container.appendChild(videoB);

				// Skip last frame - switch before video ends
				function checkTimeAndSwitch(video) {
					if (video.duration - video.currentTime < 0.1) {
						video.pause();
						playNextVideo();
					}
				}
				videoA.addEventListener('timeupdate', function() { checkTimeAndSwitch(videoA); });
				videoB.addEventListener('timeupdate', function() { checkTimeAndSwitch(videoB); });

				// Load video list from images directory
				$.get('./api/list?dir=images')
					.done(function(data) {
						if (data.files) {
							headerVideos = data.files
								.filter(function(f) { return f.name.endsWith('.mp4'); })
								.map(function(f) { return f.name; });

							if (headerVideos.length > 0) {
								shuffledVideos = shuffleArray(headerVideos);
								playNextVideo();
							}
						}
					});
			});
		})();
		</script>
