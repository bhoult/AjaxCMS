		<!-- Load theme -->
		<script>
			theme = default_background;
			// Load theme CSS
			$('<link>').appendTo('head').attr({type : 'text/css', rel : 'stylesheet'}).attr('href', 'themes/'+ default_background+'/theme.css?v=' + Date.now());
			// Load theme background.js and signal when ready
			$.getScript('themes/'+ default_background+'/background.js')
				.done(function() {
					// Theme script loaded, signal ready after a brief delay for initialization
					setTimeout(function() {
						if (window.themeReady) {
							window.themeReady();
						}
					}, 100);
				})
				.fail(function(jqxhr, settings, exception) {
					console.error('Error loading theme:', exception);
					// Still signal ready so the site doesn't hang
					if (window.themeReady) {
						window.themeReady();
					}
				});
		</script>
		
		<style>
			body {
				overflow-x: hidden;
				padding-bottom: 100px;
				margin: 0;
			}
			
			#background {
			  position:fixed;
			  z-index:0;
			  top:0;
			  left:0;
			  background: linear-gradient(#FFF, #225);
			  /* Width and height set via JavaScript to prevent scaling */
			}
			#background-div {
			  position:fixed;
			  z-index:0;
			  width:100%;
			  height:100%;
			  overflow:hidden;
			  pointer-events:none;
			}
			
			nav.navbar {
				margin-top:0px;
				margin-bottom:0px;
				z-index:1;
				border-radius:0px 0px 10px 10px;
				pointer-events:auto;
			}
			
			.container {
				margin-top:0px !important;
				margin-bottom:0px !important;
				margin-left:auto !important;
				margin-right:auto !important;
				padding:0px !important;
				padding-bottom:100px !important;
				border-radius:4px 4px 0px 0px;
				color:black;
			}
			
			#a, #b {
				position:absolute;
				top: 0px;
				width:100%;
				z-index:0;
				background-color:rgba(0, 20, 0, 0.95);
				border-radius:0px 0px 8px 8px;
				color:#00ff66;
				margin-bottom:50px;
				padding-bottom:100px;
				pointer-events:none;
			}

			#a *, #b * {
				pointer-events:auto;
			}
			
			#main {
				width:98%!important;
				max-width:530px;
				margin: 0 auto;
			}

			@media (min-width: 768px) {
				#main {
					max-width:706px;
				}
			}
			@media (min-width: 992px) {
				#main {
					max-width:960px;
				}
			}
			@media (min-width: 1200px) {
				#main {
					max-width:1117px;
				}
			}
			@media (min-width: 1400px) {
				#main {
					max-width:1294px;
				}
			}
			
			#main>div {
				padding: 0px 10px 20px 10px;
			}
			
			#main img {
				margin:10px;
			}
			#main .carousel img {
				margin:0px;
			}
			img.thumb {
				width:20px;
			}
			img.icon {
				width:70px;
			}
			img.small {
				width:300px;
			}
			img.medium {
				width:600px;
			}
			img.large {
				width:900px;
			}
			img.left {
				float:left;
			}
			img.right {
				float:right;
			}
			
			.carousel {
				padding:0px;
			}
			
			ul.filelist li {
				list-style-type:none;
			}
			ul.filelist li a.folder:hover {
				text-decoration:none;
			}
			
			footer {
				position:fixed;
				left:0px;
				bottom:0px;
				width:100%;
				background:rgba(0, 20, 0, 0.95);
				color:#00ff66;
				text-align:center;
				padding:5px;
				font-size:2vw;
				border-top: 1px solid rgba(0, 255, 102, 0.3);
				pointer-events:auto;
			}
			footer a {color:#00ff66;}
			footer a:hover {color:#66ffaa; text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);}

			
			.blog .blog_entry {
				border:1px solid black;
				border-radius:10px;
				margin:10px;
				padding:5px;
				background-color:rgba(255,255,255,0.8);
				position:relative;
				cursor: pointer; 
			}
			.blog .blog_entry h1 {
				margin-top:0px;
				font-size:150%;
			}
			.blog .blog_entry time {
				position:absolute;
				top:5px;
				right:5px;
			}
			
			
			@media (min-width: 544px) {  }
			@media (min-width: 768px) { footer {font-size:14px;} }
			@media (min-width: 992px) {  }
			@media (min-width: 1200px) {  }
			

		/* Image gallery styling for wildcard galleries */
		.image-gallery img {
			width: 100%;
			height: auto;
			border-radius: 4px;
			cursor: pointer;
			transition: transform 0.2s;
		}

		.image-gallery img:hover {
			transform: scale(1.05);
		}

		/* Lightbox for expanded images */
		.image-lightbox {
			display: none;
			position: fixed;
			z-index: 9999;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0);
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		.image-lightbox.active {
			background-color: rgba(0, 0, 0, 0.9);
		}

		.image-lightbox img {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%) scale(0.8);
			width: 100%;
			height: auto;
			max-height: 100vh;
			object-fit: contain;
			opacity: 0;
			transition: all 0.3s ease;
		}

		.image-lightbox.active img {
			transform: translate(-50%, -50%) scale(1);
			opacity: 1;
		}
		</style>
	</head>
