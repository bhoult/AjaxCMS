			// Load theme background.js and signal when ready
			$.getScript('themes/'+ default_background+'/background.js')
				.done(function() {
					// Theme script loaded, signal ready after a brief delay for initialization
					setTimeout(function() {
						if (window.themeReady) {
							window.themeReady();
						}
					}, 100);
				})
				.fail(function(jqxhr, settings, exception) {
					console.error('Error loading theme:', exception);
					// Still signal ready so the site doesn't hang
					if (window.themeReady) {
						window.themeReady();
					}
				});

		<!-- Header star stream animation -->
		<script>
		$(document).ready(function() {
			// Wait for container to fade in (1000ms) and navbar to render
			setTimeout(function() {
				const canvas = document.getElementById('header-stars');
				if (!canvas) {
					console.log('Header stars canvas not found');
					return;
				}

				const ctx = canvas.getContext('2d');
				const navbar = canvas.parentElement;

				function resizeCanvas() {
					canvas.width = navbar.offsetWidth;
					canvas.height = navbar.offsetHeight;
					console.log('Canvas resized:', canvas.width, canvas.height);
				}
				resizeCanvas();
				window.addEventListener('resize', resizeCanvas);

				const stars = [];
				const starCount = 25; // Reduced from 100 to 25 (1/4)
				const colors = [
					'rgba(178, 34, 52, ',  // Red
					'rgba(255, 255, 255, ', // White
					'rgba(0, 63, 135, '     // Blue
				];

				let globalOpacity = 0; // Start at 0 for fade-in effect
				const fadeInDuration = 2000; // 2 seconds
				const fadeInStart = Date.now();

				// Create stars
				for (let i = 0; i < starCount; i++) {
					const colorIndex = Math.floor(Math.random() * colors.length);
					stars.push({
						x: Math.random() * canvas.width,
						y: Math.random() * canvas.height,
						size: Math.random() * 0.5 + 0.2, // Start much smaller (0.2-0.7px)
						speed: (Math.random() * 2 + 1) * 0.7, // 30% slower (multiply by 0.7)
						baseOpacity: Math.random() * 0.5 + 0.5, // Store base opacity
						colorPrefix: colors[colorIndex], // Store color prefix
						hasOutline: colorIndex !== 1, // true for red (0) and blue (2), false for white (1)
						rotation: Math.random() * Math.PI * 2, // Random starting rotation
						rotationSpeed: (Math.random() - 0.5) * 0.02 // Random spin direction and speed
					});
				}

				// Function to draw a 5-pointed star with rotation
				function drawStar(x, y, size, fillStyle, rotation, shouldStroke) {
					const spikes = 5;
					const outerRadius = size;
					const innerRadius = size * 0.4;
					let rot = Math.PI / 2 * 3 + rotation; // Add rotation offset
					let step = Math.PI / spikes;

					ctx.beginPath();
					// Start at first outer point
					ctx.moveTo(x + Math.cos(rot) * outerRadius, y + Math.sin(rot) * outerRadius);

					for (let i = 0; i < spikes; i++) {
						rot += step;
						// Inner point
						ctx.lineTo(x + Math.cos(rot) * innerRadius, y + Math.sin(rot) * innerRadius);
						rot += step;
						// Next outer point
						ctx.lineTo(x + Math.cos(rot) * outerRadius, y + Math.sin(rot) * outerRadius);
					}

					ctx.closePath();
					ctx.fillStyle = fillStyle;
					ctx.fill();

					if (shouldStroke) {
						ctx.stroke();
					}
				}

				// Pre-calculate canvas bounds for faster checks
				let canvasWidthCached = canvas.width;
				let canvasHeightCached = canvas.height;

				window.addEventListener('resize', function() {
					canvasWidthCached = canvas.width;
					canvasHeightCached = canvas.height;
				});

				function animate() {
					ctx.clearRect(0, 0, canvasWidthCached, canvasHeightCached);

					// Update global opacity for fade-in (only during fade-in period)
					if (globalOpacity < 1) {
						const elapsed = Date.now() - fadeInStart;
						if (elapsed < fadeInDuration) {
							globalOpacity = elapsed / fadeInDuration; // 0 to 1 over 2 seconds
						} else {
							globalOpacity = 1;
						}
					}

					const starsLen = stars.length;
					for (let i = 0; i < starsLen; i++) {
						const star = stars[i];

						// Move star to the right
						star.x += star.speed;

						// Update rotation
						star.rotation += star.rotationSpeed;

						// Calculate size based on position across the width
						// Size grows linearly from 0.2px at left edge to 45px at right edge (75% of 60)
						const progress = (star.x + 10) / (canvasWidthCached + 20); // 0 to 1
						star.size = 0.2 + (progress * 44.8); // 0.2 to 45

						// If star goes completely off right edge (including its size), respawn on left
						if (star.x > canvasWidthCached + star.size) {
							star.x = -50; // Start further left so size calculation makes it small
							star.y = Math.random() * canvasHeightCached;
						}

						// Apply global fade-in to star opacity
						const finalOpacity = star.baseOpacity * globalOpacity;

						// Build color string once
						const fillColor = star.colorPrefix + finalOpacity + ')';

						// Set shadow properties
						ctx.shadowBlur = star.size * 2;
						ctx.shadowColor = fillColor;

						// Set stroke style for outlined stars (red and blue)
						if (star.hasOutline) {
							ctx.strokeStyle = 'rgba(255, 255, 255, ' + finalOpacity + ')';
							ctx.lineWidth = star.size * 0.08; // Outline width proportional to star size
						}

						drawStar(star.x, star.y, star.size, fillColor, star.rotation, star.hasOutline);
					}

					// Reset shadow once at the end
					ctx.shadowBlur = 0;

					requestAnimationFrame(animate);
				}

				animate();
			}, 1200); // Wait for container fade-in (1000ms) + small buffer for rendering (200ms)
		});
		</script>
