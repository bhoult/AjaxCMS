<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<meta charset="UTF-8">
		<title>AjaxCMS</title>
		
		<!-- Configuration -->
		<script>
			var default_background = "gl_city";
			var ajaxcms_google_analytics = 'UA-84079705-1';
			var ajaxcms_splash_time = 3000;
		</script>
		
		<!-- Jquery -->
		<script src="node_modules/jquery/dist/jquery.min.js"></script>
		<script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
		<link href="node_modules/jquery-ui-dist/jquery-ui.min.css" rel="stylesheet">  
		
		<!-- Bootstrap -->
		<link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
		
		<!-- Markdown parser -->
		<script src="node_modules/marked/marked.min.js"></script>
		
		<!-- Polyfills -->
		
		<!-- Background Animation -->
		<script src="node_modules/victor/build/victor.min.js"></script>
		<script src="js/canvasstuff.js"></script>
		<script src="js/jquery-mobile-swipe.js"></script>
		<script src="node_modules/segment-js/segment.min.js"></script>
		
		<!-- CMS Javascript -->
		<script src="js/ajaxcms.js"></script>
		
		<!-- fonts.google.com - Night City theme fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

		<!-- Three.js -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

		<!-- Load theme -->
		<script>
			theme = default_background;
			$.getScript('themes/'+default_background+'/background.js');
			$('<link>').appendTo('head').attr({type : 'text/css', rel : 'stylesheet'}).attr('href', 'themes/'+default_background+'/theme.css?v=' + Date.now());
		</script>
		
		<style>
			body {
				overflow-x: hidden;
			}

			html {
				overflow-y: auto;
				overflow-x: hidden;
			}
			
			#background {
			  position:fixed;
			  z-index:-1;
			  width:100%;
			  height:100%;
			  background: linear-gradient(#FFF, #225);
			}
			#background-div {
			  position:fixed;
			  z-index:0;
			  width:100%;
			  height:100%;
			  overflow:hidden;
			}
			
		/* Navbar styling handled by theme.css */
		nav.navbar {
			margin-bottom:0px;
			z-index:1;
		}
		/* Carousel indicator styling - consistent for all states */
		.carousel-indicators button {
			width: 30px;
			height: 3px;
			background-color: rgba(255, 255, 255, 0.5);
			border: none;
			margin: 0 3px;
		}

		.carousel-indicators button.active {
			background-color: rgba(255, 255, 255, 1);
			width: 30px;
			height: 3px;
		}


			/* Container and content styling handled by theme.css */
			.container {
				padding:0px;
				padding-bottom:0px;
			}

			#a, #b {
				position:absolute;
				top: 0px;
				width:100%;
				z-index:0;
				margin-bottom:0px;
				padding-bottom:0px;
			}

			#a, #b {
				width:98%!important;
				max-width:530px;
				margin: 0 auto;
				margin-left: 13px !important;
			}

			@media (min-width: 768px) {
				#a, #b {
					max-width:706px;
				}
			}
			@media (min-width: 992px) {
				#a, #b {
					max-width:941px;
				}
			}
			@media (min-width: 1200px) {
				#a, #b {
					max-width:1117px;
				}
			}
			@media (min-width: 1400px) {
				#a, #b {
					max-width:1294px;
				}
			}

			#main>div {
				padding: 0px 10px 20px 10px;
			}
			
			#main img {
				margin:10px;
			}
			#main .carousel img {
				margin:0px;
			}
			img.thumb {
				width:20px;
			}
			img.icon {
				width:70px;
			}
			img.small {
				width:300px;
			}
			img.medium {
				width:600px;
			}
			img.large {
				width:900px;
			}
			img.left {
				float:left;
			}
			img.right {
				float:right;
			}
			
			.carousel {
				padding:0px;
			}
			
			ul.filelist li {
				list-style-type:none;
			}
			ul.filelist li a.folder:hover {
				text-decoration:none;
			}
			
			footer {   
				position:fixed;
				left:0px;
				bottom:0px;
				width:100%;
				background:white;
				color:black;
				text-align:center;
				padding:5px;
				font-size:2vw;
			}
			footer a {color:blue;}
			footer a:hover {color:#55F;}
			.blog .blog_entry {
				border:1px solid black;
				border-radius:10px;
				margin:10px;
				padding:5px;
				background-color:rgba(255,255,255,0.8);
				position:relative;
				cursor: pointer; 
			}
			.blog .blog_entry h1 {
				margin-top:0px;
				font-size:150%;
			}
			.blog .blog_entry time {
				position:absolute;
				top:5px;
				right:5px;
			}
			
			
			@media (min-width: 544px) {  }
			@media (min-width: 768px) { footer {font-size:14px;} }
			@media (min-width: 992px) {  }
			@media (min-width: 1200px) {  }
			
		</style>
	</head>
	
	<body>
		<canvas id="background"></canvas>
		<div id="background-div"></div>
		<div class="container" style="display:none;">
			<header>
			</header>
			
			<!-- Static navbar -->
			<nav class="navbar navbar-expand-lg navbar-light bg-light">
				<div class="container-fluid">
				    <a class="navbar-brand" href="javascript:void(0);" style="width:200px;"><img src='images/ajaxcms.svg' style="position:relative; top: -20px; z-index:2; width:100%;"></a>
				    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
				      <span class="navbar-toggler-icon"></span>
				    </button>
				  <div class="collapse navbar-collapse" id="navbar">
				    <ul id='menu' class="navbar-nav me-auto mb-2 mb-lg-0">
				    	<!-- Pages get inserted here to make menu -->
				    </ul>
				  </div><!--/.navbar-collapse -->
				</div><!--/.container-fluid -->
			</nav>
			
			<main id="main" style="position:relative; width:100%;">
				<!-- Content gets inserted here, a and b are for making page style transitions. -->
				<div id='a' style=""></div>
				<div id='b' style="display:none;"></div>
			</main>
			
			<footer>
				<div>
					&#9400; AjaxCMS 2016 All Rights Reserved. Email: <a href="mailto:brandon.hoult@softwyre.com">brandon.hoult@softwyre.com</a> for more information. Powered by AjaxCMS (GPL v3) 
				</div>
			</footer>
		</div>
		
		<!-- Google Analytics -->
		<script>
		  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
		
		  ga('create', ajaxcms_google_analytics, 'auto');
		  //ga('send', 'pageview');
		</script>
	</body>

</html>
