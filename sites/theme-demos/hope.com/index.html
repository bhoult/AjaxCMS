<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<meta charset="UTF-8">
		<title>Hope - Organic Growth Theme</title>

		<!-- Configuration -->
		<script>
			var default_background = "hope";
			var ajaxcms_google_analytics = '';
			var ajaxcms_splash_time = 2000;
		</script>

		<!-- jQuery (from npm) -->
		<script src="node_modules/jquery/dist/jquery.min.js"></script>
		<script src="node_modules/jquery-ui-dist/jquery-ui.min.js"></script>
		<link href="node_modules/jquery-ui-dist/jquery-ui.min.css" rel="stylesheet">

		<!-- Bootstrap (from npm) -->
		<link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

		<!-- Markdown parser (from npm) -->
		<script src="node_modules/marked/lib/marked.umd.js"></script>

		<!-- Background Animation Libraries (from npm) -->
		<script src="js/victor.js"></script>
		<script src="node_modules/segment-js/dist/segment.min.js"></script>

		<!-- Custom Background Animation & Swipe Support -->
		<script src="js/canvasstuff.js"></script>
		<script src="js/jquery-mobile-swipe.js"></script>

		<!-- CMS Javascript -->
		<script src="js/ajaxcms.js"></script>

		<!-- fonts.google.com -->
		<link href="https://fonts.googleapis.com/css?family=Montserrat+Alternates:700" rel="stylesheet">

		<!-- Load theme -->
		<script>
			theme = default_background;
			// Load theme CSS
			$('<link>').appendTo('head').attr({type : 'text/css', rel : 'stylesheet'}).attr('href', 'themes/'+default_background+'/theme.css');
			// Load theme background.js and signal when ready
			$.getScript('themes/'+default_background+'/background.js')
				.done(function() {
					// Theme script loaded, signal ready after a brief delay for initialization
					setTimeout(function() {
						if (window.themeReady) {
							window.themeReady();
						}
					}, 100);
				})
				.fail(function(jqxhr, settings, exception) {
					console.error('Error loading theme:', exception);
					// Still signal ready so the site doesn't hang
					if (window.themeReady) {
						window.themeReady();
					}
				});
		</script>

		<style>
			body {
				overflow-x: hidden;
				padding-bottom: 100px;
			}

			#background {
			  position:fixed;
			  z-index:-1;
			  width:100%;
			  height:100%;
			  background: transparent;
			}
			#background-div {
			  position:fixed;
			  z-index:0;
			  width:100%;
			  height:100%;
			  overflow:hidden;
			}

			nav.navbar {
				margin-bottom:0px;
				z-index:1;
				border-radius:0px;
				background-color: transparent !important;
				border: none !important;
			}

			.container {
				padding-bottom:100px;
				border-radius:0px;
				color:black;
			}

			#a, #b {
				position:absolute;
				top: 80px;
				left: 13px;
				right: 0;
				z-index:0;
				background-color:transparent;
				border-radius:0px;
				border: none;
				color:black;
				margin-bottom:50px;
				padding-bottom:100px;
			}

			#main {
				width: 100%;
				position: relative;
				margin-left: 13px !important;
			}

			#main>div {
				padding: 0px 10px 20px 10px;
			}

			#main img {
				margin:10px;
			}
			#main .carousel img {
				margin:0px;
			}
			img.thumb {
				width:20px;
			}
			img.icon {
				width:70px;
			}
			img.small {
				width:300px;
			}
			img.medium {
				width:600px;
			}
			img.large {
				width:900px;
			}
			img.left {
				float:left;
			}
			img.right {
				float:right;
			}

			.carousel {
				padding:0px;
			}

			/* Image gallery styling for wildcard galleries */
			.image-gallery img {
				width: 100%;
				height: auto;
				border-radius: 4px;
				cursor: pointer;
				transition: transform 0.2s;
			}

			.image-gallery img:hover {
				transform: scale(1.05);
			}

			/* Lightbox for expanded images */
			.image-lightbox {
				display: none;
				position: fixed;
				z-index: 9999;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0);
				cursor: pointer;
				transition: background-color 0.3s ease;
			}

			.image-lightbox.active {
				background-color: rgba(0, 0, 0, 0.9);
			}

			.image-lightbox img {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%) scale(0.8);
				width: 100%;
				height: auto;
				max-height: 100vh;
				object-fit: contain;
				opacity: 0;
				transition: all 0.3s ease;
			}

			.image-lightbox.active img {
				transform: translate(-50%, -50%) scale(1);
				opacity: 1;
			}

			ul.filelist li {
				list-style-type:none;
			}
			ul.filelist li a.folder:hover {
				text-decoration:none;
			}

			footer {
				position:fixed;
				left:0px;
				bottom:0px;
				width:100%;
				background:rgba(255,255,255,0.7);
				color:black;
				text-align:center;
				padding:5px;
				font-size:2vw;
				border: none;
			}
			footer a {color:blue;}
			footer a:hover {color:#55F;}


			.blog .blog_entry {
				border:1px solid #e0e0e0;
				border-radius:0px;
				margin:10px;
				padding:5px;
				background-color:transparent;
				position:relative;
				cursor: pointer;
			}
			.blog .blog_entry h1 {
				margin-top:0px;
				font-size:150%;
			}
			.blog .blog_entry time {
				position:absolute;
				top:5px;
				right:5px;
			}


			@media (min-width: 544px) {  }
			@media (min-width: 768px) { footer {font-size:14px;} }
			@media (min-width: 992px) {  }
			@media (min-width: 1200px) {  }

		</style>
	</head>

	<body>
		<div id="gradient-background" style="position:fixed;top:0;left:0;width:100%;height:800px;z-index:-2;pointer-events:none;background:linear-gradient(to bottom, #97e2ffff 0%, white 100%);"></div>
		<canvas id="background"></canvas>
		<div id="background-div"></div>
		<div class="container" style="display:none;">
			<header>
			</header>

			<!-- Static navbar -->
		<nav class="navbar navbar-expand-lg navbar-light">
			<div class="container">
			    <a class="navbar-brand" href="javascript:void(0);" style="width:200px;font-size:24px;font-weight:300;">Hope</a>
			    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
			      <span class="navbar-toggler-icon"></span>
			    </button>
			  <div class="collapse navbar-collapse" id="navbar">
			    <ul id='menu' class="navbar-nav me-auto mb-2 mb-lg-0">
			    	<!-- Pages get inserted here to make menu -->
			    </ul>
			  </div><!--/.navbar-collapse -->
			</div><!--/.container-fluid -->
		</nav>

		<div class="container">
			<main id="main" style="position:relative; margin-left: 13px !important;">
				<!-- Content gets inserted here, a and b are for making page style transitions. -->
				<div id='a' style=""></div>
				<div id='b' style="display:none;"></div>
			</main>
		</div>

			<footer>
				<div>
					Hope Theme - Powered by AjaxCMS
				</div>
			</footer>
		</div>

	</body>

</html>
