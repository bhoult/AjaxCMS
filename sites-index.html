<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjaxCMS Sites</title>

    <!-- Markdown parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/0.3.5/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .sites-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .folder {
            margin-bottom: 30px;
        }

        .folder-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .folder-icon {
            font-size: 1.5em;
            margin-right: 10px;
            color: #667eea;
        }

        .folder-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
        }

        .folder-root .folder-name {
            color: #764ba2;
        }

        .sites-list {
            margin-left: 20px;
        }

        .site-item {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
            transition: all 0.2s ease;
        }

        .site-item:hover {
            background: #f8f9ff;
            border-color: #667eea;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.1);
        }

        .site-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 10px;
            gap: 15px;
        }

        .site-name {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1em;
        }

        .site-url {
            font-family: monospace;
            color: #666;
            font-size: 0.9em;
        }

        .site-url a {
            color: #667eea;
            text-decoration: none;
        }

        .site-url a:hover {
            text-decoration: underline;
        }

        .site-description {
            color: #333;
            line-height: 1.6;
            margin-left: 0;
        }

        .site-description p {
            margin: 0 0 10px 0;
        }

        .site-description p:last-child {
            margin-bottom: 0;
        }

        .site-description em {
            color: #999;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .no-sites {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #666;
        }

        .no-sites h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .no-sites code {
            background: #f4f4f4;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .sites-wrapper {
                padding: 20px;
            }

            .sites-list {
                margin-left: 10px;
            }

            .folder-name {
                font-size: 1.1em;
            }

            .site-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .site-name {
                font-size: 1em;
            }

            .site-url {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AjaxCMS Sites</h1>
            <p>Select a site to visit</p>
        </div>

        <div id="sites-container">
            <div class="loading">Loading sites...</div>
        </div>

        <div class="footer">
            <p>AjaxCMS Multi-Site Server</p>
        </div>
    </div>

    <script>
        async function loadSites() {
            const container = document.getElementById('sites-container');

            try {
                const response = await fetch('/api/sites');
                if (!response.ok) {
                    throw new Error('Failed to load sites');
                }

                const data = await response.json();
                const sites = data.sites;

                if (sites.length === 0) {
                    container.innerHTML = `
                        <div class="no-sites">
                            <h2>No sites found</h2>
                            <p>Create a new site by adding a directory to the <code>sites/</code> folder.</p>
                            <p style="margin-top: 15px;">Example: <code>sites/mysite.com/</code></p>
                        </div>
                    `;
                    return;
                }

                // Organize sites by folder
                const folders = {};
                sites.forEach(site => {
                    const pathParts = site.path.split('/');
                    const folderPath = pathParts.length > 1 ? pathParts.slice(0, -1).join('/') : '';

                    if (!folders[folderPath]) {
                        folders[folderPath] = [];
                    }
                    folders[folderPath].push(site);
                });

                // Sort folder keys so root comes first, then alphabetically
                const sortedFolders = Object.keys(folders).sort((a, b) => {
                    if (a === '') return -1;
                    if (b === '') return 1;
                    return a.localeCompare(b);
                });

                // Generate HTML for each folder
                const foldersHtml = sortedFolders.map(folderPath => {
                    const folderSites = folders[folderPath];
                    const folderName = folderPath || 'Root';
                    const isRoot = folderPath === '';

                    const sitesHtml = folderSites.map(site => {
                        const sitePath = `/${site.path}/`;

                        // Convert markdown description to HTML
                        let descriptionHtml = '<em>No description</em>';
                        if (site.description && site.description.trim()) {
                            descriptionHtml = marked(site.description);
                        }

                        return `
                            <div class="site-item">
                                <div class="site-header">
                                    <div class="site-name">${site.name}</div>
                                    <div class="site-url"><a href="${sitePath}">${sitePath}</a></div>
                                </div>
                                <div class="site-description">${descriptionHtml}</div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="folder ${isRoot ? 'folder-root' : ''}">
                            <div class="folder-header">
                                <span class="folder-icon">${isRoot ? '🏠' : '📁'}</span>
                                <span class="folder-name">${folderName}</span>
                            </div>
                            <div class="sites-list">
                                ${sitesHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="sites-wrapper">
                        ${foldersHtml}
                    </div>
                `;

            } catch (error) {
                console.error('Error loading sites:', error);
                container.innerHTML = `
                    <div class="error">
                        <h2>Error loading sites</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        loadSites();
    </script>
</body>
</html>
