# Nginx configuration for AjaxCMS
# This should be placed in /etc/nginx/sites-available/ajaxcms
# Then symlinked to /etc/nginx/sites-enabled/ajaxcms

# HTTP server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ajaxcms.org www.ajaxcms.org web-tec.us;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ajaxcms.org www.ajaxcms.org web-tec.us;

    # SSL certificate paths (update these after getting certificates)
    ssl_certificate /etc/letsencrypt/live/ajaxcms.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajaxcms.org/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Node.js server
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
